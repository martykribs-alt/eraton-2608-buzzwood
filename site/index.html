<style>

  --crit:#e08f78; --crit-soft:#3a231d; --warn:#d9ab55; --warn-soft:#332917; --ok:#8cc3a1; --ok-soft:#1b3026; color-scheme:dark;

:root[data-theme="dark"]{

/* ---------- RULES LANE ---------- */
function computeFindings(){
  var F=[];
  if(!FEASIBLE && P.TEXT.feasibilityFinding) F.push(P.TEXT.feasibilityFinding);
  REF.forEach(function(r){
    if(r.missing) F.push({sev:r.critical?"crit":"warn",type:"Missing reference",t:r.id+" not on file: "+r.fact,why:r.note||"",owner:r.critical?"Owner with City planner":"Owner's rep",src:r.src});
    else if(r.checked && days(addDays(r.checked,r.interval))<0) F.push({sev:"warn",type:"Stale reference",t:r.id+" past its re-check date ("+fmt(addDays(r.checked,r.interval))+")",why:r.fact,owner:"Owner's rep",src:r.src});
    if(r.unconfirmed){ var u=PATHS.filter(function(p){return (p.relies||[]).indexOf(r.id)>=0;}).map(function(p){return p.id;}); if(u.length) F.push({sev:"warn",type:"Unconfirmed interpretation",t:u.join(", ")+(u.length>1?" rest on ":" rests on ")+r.id+", not yet confirmed by "+(r.confirmBy||"the floodplain administrator"),why:r.fact,owner:"Owner's rep",src:r.src}); }
  });
  CONFLICTS.forEach(function(x){ if(!x.resolved) F.push({sev:x.sev,type:"Conflicting documents",t:x.t,why:x.doc+" against "+x.against+". "+x.why,owner:x.owner,src:x.src}); });
  if(!rulings["D-1"]) F.push({sev:"warn",type:"Constraint unruled",t:"Binding constraint proposed but not ruled",why:"Advisory proposes cost against comp-supported price.",owner:"Owner",src:"PF"});
  PATHS.forEach(function(p){
    if(!p.by||!String(p.by).trim()) F.push({sev:"warn",type:"Path without authority",t:p.id+" names no authority",why:p.name,owner:"Owner's rep",src:null});
    if(p.timeline && (p.status==="Pursuing"||p.status==="Filed")){
      var e=EXTERNAL.filter(function(x){return x.id===p.timeline.needs;})[0], eff=e?effectiveDate(e):null, dl=clockDate(p.timeline.before);
      var ck=CLOCKS.filter(function(x){return x.id===p.timeline.before;})[0];
      if(!eff||!dl) F.push({sev:"crit",type:"Timeline conflict",t:p.id+" cannot be shown to fit: "+(e?e.name:p.timeline.needs)+" against "+(ck?ck.what:p.timeline.before),why:(!eff?(e?e.name+" is at "+e.stage+"; its effective date cannot be computed until Preliminary is dated. ":""):"")+(!dl?(ck?ck.what+" has no date"+(ck.basis?" ("+ck.basis+")":"")+". ":""):"")+"Flood rules lock at building permit application (R-07).",owner:"Owner with City planner",src:"DA"});
      else if(eff>dl) F.push({sev:"crit",type:"Timeline conflict",t:p.id+": "+e.name+" effective "+fmt(eff)+", after "+ck.what+" "+fmt(dl),why:"Request the City Manager's 12-month phase extension or change the path.",owner:"Owner with City planner",src:"DA"});
    }
  });
  var openC=CONDITIONS.filter(function(c){return c.status!=="Satisfied"&&c.status!=="Removed";});
  if(!BASELINE){ if(openC.length) F.push({sev:"warn",type:"Timeline conflict",t:"No condition timeline can be checked: the baseline schedule (R-18) is not loaded",why:"Gates for "+openC.map(function(c){return c.id;}).join(", ")+" are phase names with no dates.",owner:"Owner",src:"BASE"}); }
  else openC.forEach(function(c){
    var g=gateDate(c);
    if(!g) F.push({sev:"warn",type:"Timeline conflict",t:c.id+": gate '"+c.gate+"' has no date in the baseline",why:c.text,owner:"Owner",src:"BASE"});
    else { var late=Object.keys(LINK_NAMES).filter(function(k){var l=c.links[k];return l.date&&!l.done&&l.date>g;}); if(late.length) F.push({sev:"crit",type:"Timeline conflict",t:c.id+": "+late.map(function(k){return LINK_NAMES[k].toLowerCase();}).join(", ")+" planned after its gate ("+fmt(g)+")",why:c.text,owner:"Owner's rep",src:"BASE"}); }
  });
  CLOCKS.forEach(function(c){
    if(c.closed||c.recheck||c.notStarted) return;
    var why=null, sev="warn";
    if(!c.date){ why="cannot be computed"; sev="crit"; }
    else { var n=days(c.date); if(n<0) why=Math.abs(n)+" days overdue"; else if(n<=30) why="due in "+n+" days"; }
    if(!c.owner||c.owner==="–") why=(why?why+"; ":"")+"no owner";
    if(why) F.push({sev:sev,type:"Clock at risk",t:c.what+": "+why,why:c.why||((c.basis?c.basis+" · ":"")+(c.date?fmt(c.date):"")),owner:c.owner&&c.owner!=="–"?c.owner:"Owner",src:null});
  });
  CONDITIONS.forEach(function(c){
    var miss=Object.keys(LINK_NAMES).filter(function(k){return c.links[k].missing;});
    var nod=Object.keys(LINK_NAMES).filter(function(k){var l=c.links[k];return !l.missing&&!l.date;});
    if(miss.indexOf("budget")>=0) F.push({sev:"crit",type:"Missing link",t:c.id+" is not priced",why:c.text+". "+c.links.budget.who+".",owner:"Owner",src:"PF"});
    var other=miss.filter(function(k){return k!=="budget";});
    if(other.length||nod.length) F.push({sev:"warn",type:"Missing link",t:c.id+": "+(other.length?other.map(function(k){return LINK_NAMES[k].toLowerCase();}).join(", ")+" missing":"")+(other.length&&nod.length?"; ":"")+(nod.length?nod.map(function(k){return LINK_NAMES[k].toLowerCase();}).join(", ")+" undated":""),why:c.text,owner:"Owner's rep",src:null});
  });
  ASSUMPTIONS.forEach(function(a){ var q=quality(a); if(a.impact==="High"&&(q==="Weak"||q==="None"||q==="Medium")&&a.id!=="M-1") F.push({sev:"warn",type:"Evidence below the decision",t:a.name+": top evidence is rung "+(topRung(a)||"none"),why:"Next: "+a.next+" ("+a.cost+")",owner:"Owner's rep",src:"PF"}); });
  Object.keys(rulings).forEach(function(id){ var dc=DECISIONS.filter(function(x){return x.id===id;})[0]; if(!dc||!(dc.forA.length||dc.againstA.length)) F.push({sev:"warn",type:"Decision without evidence",t:id+" ruled with no evidence recorded",why:rulings[id].choice,owner:"Owner",src:null}); });
  F.forEach(function(f){ if(FINDING_TYPES.indexOf(f.type)<0) throw new Error("Finding type not in the closed list: "+f.type); });
  var order={crit:0,warn:1}; F.sort(function(a,b){return order[a.sev]-order[b.sev];});
  return F;
}

/* ---------- RENDER ---------- */
function money(t){ return t.replace(/\$[\d,]+(\.\d+)?(\/SF)?/g,function(m){return $m(m);}); }
function render(){
  var F=computeFindings(), crit=F.filter(function(f){return f.sev==="crit";}).length;
  document.getElementById("stamp-findings").textContent=F.length+" ("+crit+" critical)";
  document.getElementById("tab-count").textContent=F.length;
  var r1=rulings["D-1"], r2=rulings["D-2"];
  var fe=document.getElementById("q-feasible");
  fe.textContent=FEASIBLE?"Yes":P.TEXT.feasibleNo; fe.className="ans";
  document.getElementById("q-feasible-why").innerHTML=money(P.TEXT.feasibleWhy);
  renderPathway();
  document.getElementById("q-terms").textContent=r2?r2.choice:P.TEXT.termsDefault;
  document.getElementById("q-terms-why").innerHTML=r2?"Your ruling, "+esc(r2.when)+".":money(P.TEXT.termsWhy);
  var miss=REF.filter(function(r){return r.missing;}).length;
  document.getElementById("q-missing").textContent=F.length+" findings";
  document.getElementById("q-missing-why").textContent=crit+" critical. "+miss+" governing facts missing"+P.TEXT.missingTail;

  document.getElementById("findings").innerHTML=F.map(function(f){
    return '<li class="finding '+f.sev+'"><span class="sev" aria-hidden="true"></span><div class="body"><span class="lab">'+esc(f.type)+'</span><span class="t">'+money(esc(f.t))+'</span><span class="muted small">'+money(esc(f.why))+'</span></div><div class="who"><span class="lab">Owner</span><span class="small">'+esc(f.owner)+'</span>'+(f.src?'<span class="src">'+esc(SRC[f.src])+'</span>':'')+'</div></li>';
  }).join("");

  document.getElementById("advisory").innerHTML=ADVISORY.map(function(f){
    return '<li class="finding"><span class="sev" aria-hidden="true" style="background:var(--rule-2)"></span><div class="body"><span class="lab">Advisory</span><span class="t">'+money(esc(f.t))+'</span><span class="muted small">'+money(esc(f.why))+'</span></div><div class="who"><span class="src">'+esc(SRC[f.src])+'</span></div></li>';
  }).join("");

  document.getElementById("scenarios").innerHTML=SCEN.map(function(s){
    var val=(s.derived&&s.margin2!=null)?((s.margin*100).toFixed(1)+' to '+(s.margin2*100).toFixed(1)+'%'):((s.margin*100).toFixed(1)+'%');
    return '<div class="sc"'+(s.derived?' style="border-style:dashed"':'')+'><span class="lab">'+esc(s.name)+'</span><span class="m'+(s.margin>=0.15?' pass':'')+'"'+(s.derived&&s.margin<0.15?' style="color:var(--warn)"':'')+'>'+$m(val)+'</span><span class="lab" style="font-size:.66rem">margin on cost</span><span class="small">'+money(esc(s.bind))+'</span><span class="src">'+(s.derived?'<span class="chip A">A</span> v0.3 workbook, input changed, 27 Oct':'Tests passed '+s.tests+(s.testsDetail?' · '+s.testsDetail:''))+'</span></div>';
  }).join("");

  var ruledName = r1 && r1.choice!=="Cost against price" ? r1.choice : null;
  document.getElementById("constraint-state").innerHTML=r1?'<span class="chip H">H · ruled</span>':'<span class="chip A">A · proposed</span>';
  document.getElementById("constraint-text").innerHTML=ruledName?('<b>'+esc(ruledName)+'.</b> '+money(esc(CONSTRAINT.alt[ruledName]))):('<b>'+esc(CONSTRAINT.name)+'.</b> '+money(esc(CONSTRAINT.text)));
  document.getElementById("paths").innerHTML=PATHS.map(function(p){
    var flag=(p.relies||[]).length?' <span class="chip bad">premise '+p.relies.join(", ")+' unconfirmed</span>':'';
    var stc=p.status==="Blocked"?"chip bad":"chip st";
    return '<tr><td><b>'+p.id+'</b> '+esc(p.name)+flag+'<div class="muted" style="font-size:.82rem">'+money(esc(p.note))+'</div></td><td class="small">'+esc(p.by)+'</td><td class="small">'+esc(p.wait)+'</td><td><span class="'+stc+'">'+p.status+'</span></td><td class="num">'+(p.via||'–')+'</td></tr>';
  }).join("");

  var ck=CLOCKS.slice().sort(function(a,b){ function k(c){ if(c.unknown) return -1e9; if(c.closed) return 1e9; if(!c.date) return 1e8; return days(c.date);} return k(a)-k(b); });
  document.getElementById("clocks").innerHTML=ck.map(function(c){
    var head, cls="clock";
    if(c.unknown){ head='?<small>UNKNOWN</small>'; cls+=" hot"; }
    else if(c.closed){ head='–<small>CLOSED</small>'; cls+=" quiet"; }
    else if(!c.date){ head='–<small>NOT STARTED</small>'; cls+=" quiet"; }
    else { var n=days(c.date); head=Math.abs(n).toLocaleString()+'<small>'+(n<0?"DAYS OVER":"DAYS")+'</small>'; if(n<=30) cls+=" hot"; }
    var sub=c.date&&!c.closed?fmt(c.date)+' · '+esc(c.owner)+(c.basis?' · '+c.basis:''):esc(c.owner)+(c.basis?' · '+c.basis:'');
    return '<li class="'+cls+'"><div class="d">'+head+'</div><div><b>'+esc(c.what)+'</b><div class="muted small">'+sub+'</div>'+(c.why?'<div class="muted small">'+esc(c.why)+'</div>':'')+'</div></li>';
  }).join("");

  document.getElementById("conditions").innerHTML=CONDITIONS.map(function(c){
    var links=Object.keys(LINK_NAMES).map(function(k){ var l=c.links[k]; var cls=l.missing?"lk miss":(!l.date?"lk nodate":(l.done?"lk":"lk plan")); var title=l.who+(l.date?" · "+fmt(l.date):""); return '<span class="'+cls+'" title="'+esc(title)+'">'+LINK_NAMES[k]+'</span>'; }).join("");
    var stc=c.status==="Contested"?"chip bad":"chip st";
    return '<tr><td><b>'+c.id+'</b> '+esc(c.text)+rowLink(c)+'</td><td class="src">'+esc(c.src)+'</td><td><div class="links">'+links+'</div></td><td class="small">'+esc(c.gate)+''+(gateDate(c)?'<div class="muted" style="font-size:.78rem">'+fmt(gateDate(c))+'</div>':'<div class="muted" style="font-size:.78rem">no date: baseline (R-18) not loaded</div>')+'</td><td><span class="'+stc+'">'+c.status+'</span></td></tr>';
  }).join("");

  document.getElementById("assumptions").innerHTML=ASSUMPTIONS.map(function(a){
    return '<tr><td><b>'+money(esc(a.name))+'</b><div class="muted" style="font-size:.8rem">Impact '+a.impact+' · Quality '+quality(a)+(topRung(a)?' (rung '+topRung(a)+')':'')+'</div></td><td class="small">'+money(esc(a.have))+'</td><td class="small">'+esc(a.missing)+'</td><td class="small">'+esc(a.next)+'<div class="muted mono" style="font-size:.74rem">'+money(esc(a.cost))+'</div></td></tr>';
  }).join("");
  renderMatrix(); renderDecisions(); renderSummary(F);
}

function renderPathway(){
  if(!PATHWAY.length||!MARKET){ document.getElementById("ladder-chart").innerHTML='<p class="muted small">No pathway yet: it needs a pro forma and a market range.</p>'; document.getElementById("steps").innerHTML=''; return; }
  var W=760,L=150,R=20,T=10,rowH=34,H=T+PATHWAY.length*rowH+44,x0=300,x1=600;
  function X(v){return L+(v-x0)/(x1-x0)*(W-L-R);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sale price needed for 20% margin at each step, against market prices">';
  s+='<rect x="'+X(MARKET.askLo)+'" y="'+T+'" width="'+(X(MARKET.askHi)-X(MARKET.askLo))+'" height="'+(PATHWAY.length*rowH)+'" fill="var(--ok-soft)"/>';
  s+='<line x1="'+X(MARKET.closedHi)+'" x2="'+X(MARKET.closedHi)+'" y1="'+T+'" y2="'+(T+PATHWAY.length*rowH)+'" stroke="var(--ok)" stroke-dasharray="4 3"/>';
  for(var v=300;v<=600;v+=50){ s+='<line x1="'+X(v)+'" x2="'+X(v)+'" y1="'+(T+PATHWAY.length*rowH)+'" y2="'+(T+PATHWAY.length*rowH+5)+'" stroke="var(--rule-2)"/><text x="'+X(v)+'" y="'+(T+PATHWAY.length*rowH+18)+'" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono, monospace" font-size="11">$'+v+'</text>'; }
  PATHWAY.forEach(function(p,i){ var y=T+i*rowH+rowH/2;
    s+='<text x="'+(L-10)+'" y="'+(y+4)+'" text-anchor="end" fill="var(--ink)" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="500">'+esc(p.name)+'</text>';
    var a=X(p.lo),b=X(p.hi); if(b-a<6){a-=3;b+=3;}
    s+='<rect x="'+a+'" y="'+(y-7)+'" width="'+(b-a)+'" height="14" fill="var(--accent)"/>';
    s+='<text x="'+(b+6)+'" y="'+(y+4)+'" fill="var(--ink-2)" font-family="IBM Plex Mono, monospace" font-size="11" class="money">'+(p.lo===p.hi?'$'+p.lo:'$'+p.lo+'–'+p.hi)+'</text>'; });
  s+='<text x="'+X(MARKET.askLo)+'" y="'+(H-6)+'" fill="var(--ok)" font-family="IBM Plex Mono, monospace" font-size="10">'+esc(MARKET.askLabel||'')+'</text>';
  s+='<text x="'+(X(MARKET.closedHi)-4)+'" y="'+(T+12)+'" text-anchor="end" fill="var(--ok)" font-family="IBM Plex Mono, monospace" font-size="10">'+esc(MARKET.closedLabel||'')+'</text>';
  s+='</svg>';
  document.getElementById("ladder-chart").innerHTML='<div class="tablewrap"><div style="min-width:560px">'+s+'</div></div>';
  document.getElementById("steps").innerHTML=PATHWAY.filter(function(p){return p.actions.length;}).map(function(p){
    return '<div class="step"><div><span class="lab">'+esc(p.id)+'</span><h3>'+esc(p.name)+'</h3><span class="lab" style="margin-top:6px;display:block">Needed after this step</span><span class="need">'+$m('$'+p.lo+'–'+p.hi+'K per home')+'</span></div><div style="display:grid;gap:10px;min-width:0"><div><span class="lab">Constraint</span> <b>'+money(esc(p.con))+'</b></div><div class="grid3"><div><span class="lab">Value if removed</span><div>'+money(esc(p.value))+'</div></div><div><span class="lab">Time to remove</span><div>'+esc(p.time)+'</div></div><div><span class="lab">Cost to remove</span><div>'+esc(p.cost)+'</div></div></div><div><span class="lab">Removed when</span> <span class="small">'+money(esc(p.gate))+'</span></div><div><span class="lab">How to remove it</span><ul>'+p.actions.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul></div></div></div>';
  }).join('');

  }).join("");

}

/* DA_PROVISIONS: project data (projects/<id>/record.js) */
function renderDATimeline(){
  var panel=document.getElementById("da-timeline-panel");
  if(!P.daTimeline){ if(panel) panel.hidden=true; return; }
  var TL=P.daTimeline(), A0=TL.A0, A1=TL.A1, ill=TL.ill, rows=TL.rows, W=1000, L=300, R=24, T=30, rowH=26;

var FOLDER={code_text:"01 Governing Reference / Applicable Code & Criteria / Code Text",interp:"01 Governing Reference / Applicable Code & Criteria / Counsel Interpretations",staff:"01 Governing Reference / Applicable Code & Criteria / Staff Determinations",agency:"01 Governing Reference / Land Use Decision & Conditions",milestone:"Milestones · External Process (record)",finding:"Findings (record) · source stays in 02 Intake",constraint:"Constraint candidates (record)",relief:"03 Cases & Relief / [Constraint] – [Relief Path]",action:"Actions (record) · owner and closure test",condition:"Conditions register · needs five links",clock:"Clocks (record) · owner required",record:"02 Intake · Intake on file (record)"};
function classify(s){
  var o=[],low=s.toLowerCase();
  if(/condition of approval|shall (install|provide|construct|dedicate)/.test(low)) o.push({type:"Condition",kind:"condition",act:"Give it an owner, budget line, design deliverable, permit and closure test, each dated."});
  if(/recommend/.test(low)) o.push({type:"Action or relief candidate",kind:"action",act:"Assign an owner and a closure test; if it relieves a constraint, name the authority."});
  if(/\b(dsl|department of state lands|concurs?|corps)\b/.test(low) && !/has not|not yet|recommend/.test(low)) o.push({type:"Agency decision",kind:"agency",act:"Load to Reference with its date and validity period."});
  else if(/determined|determination|city manager|planning director|staff/.test(low) && !/jurisdictional determination/.test(low) && !/not yet/.test(low)) o.push({type:"Code fact · staff determination",kind:"staff",act:"Load to Reference with source and date; set a re-check date."});
  else if(/in our (reading|view)|we believe|anticipated|appears|likely/.test(low)) o.push({type:"Code fact · interpretation",kind:"interp",act:"Load to Reference marked unconfirmed; ask the jurisdiction to confirm before anything rests on it."});
  else if(/\b(ors|oar|pmc|chapter|firm)\b|permitted|precluded|shall not exceed|maximum|rules will be applied/.test(low)) o.push({type:"Code fact · code text",kind:"code_text",act:"Check against the primary source, then load with edition and date checked."});
  if(/within \d+ (days?|years?|months?)|valid for|expire|deadline/.test(low)) o.push({type:"Clock",kind:"clock",act:"Compute the date from the triggering record; assign an owner."});
  if(/(need for|requires?) (a |an )?[\w\s-]{0,30}(permit|review|approval)/.test(low) && !/recommend/.test(low)) o.push({type:"Required approval",kind:"milestone",act:"Add as a milestone with its external process stages."});
  if(/flood|wetland|base flood|fill/.test(low) && !/recommend/.test(low) && !/has not|not yet/.test(low)) o.push({type:"Constraint candidate",kind:"constraint",act:"Measure against the feasibility threshold; owner rules whether it binds."});
  if(/\bmay\b|has not|not yet|unknown|risk/.test(low)) o.push({type:"Finding",kind:"finding",act:"Open with an owner and a closure test."});
  if(/\b(was|were) (recorded|submitted|filed|signed)\b|\binstrument\b|\bfile (number|wd)\b/.test(low)) o.push({type:"Fact of record",kind:"record",act:"Log to Intake on file with its date, source and what it feeds."});
  if(!o.length) o.push({type:"Unsorted",kind:"finding",act:"A person decides where this belongs."});
  return o;
}

  paras.forEach(function(p,i){ classify(p).forEach(function(o){ n++; html.push(objHtml(i,p,o.type,o.act,FOLDER[o.kind])); }); });
  showSorted(html,n,paras.length);
  document.getElementById("sort-engine").textContent="Sorted by keyword rules"+(why?" ("+why+")":"")+".";
}
function runTranslator(){
  var paras=paragraphs(), eng=document.getElementById("sort-engine");
  if(!paras.length) return showSorted([],0,0);
  if(!/^https?:$/.test(location.protocol)||/claude\.ai$/.test(location.hostname)) return runKeywords(paras,"no ERATON app here");
  eng.textContent="Sorting with Jev…";
  fetch("/api/sort",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({statements:paras})})
   .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j; }); })
   .then(function(res){
     var html=[],n=0;
     res.results.forEach(function(r,i){
       r.objects.forEach(function(o){ n++; var k=KIND[o.kind]; html.push(objHtml(i,r.statement,k.type,k.act,FOLDER[o.kind],'<span class="chip">p '+o.p.toFixed(2)+'</span>')); });
       r.undetermined.forEach(function(o){ var k=KIND[o.kind]; html.push(objHtml(i,r.statement,k.type,"UNDETERMINED: a person decides whether this applies.","Held for review · not filed",'<span class="chip bad">p '+o.p.toFixed(2)+' · undetermined</span>')); });
       if(!r.objects.length&&!r.undetermined.length) html.push(objHtml(i,r.statement,"Unsorted","A person decides where this belongs.",FOLDER.finding));
     });
     showSorted(html,n,res.results.length);
     eng.textContent="Sorted by Jev ("+res.model+"). Taken at p ≥ "+res.accept.toFixed(2)+"; "+res.undetermined_floor.toFixed(2)+" up to "+res.accept.toFixed(2)+" held for a person.";
   })
   .catch(function(e){ runKeywords(paras,"Jev unavailable: "+e.message); });
}
var ta=document.getElementById("report"); ta.value=SAMPLE;
document.getElementById("run").addEventListener("click",runTranslator);
document.getElementById("sample").addEventListener("click",function(){docSel.value="0";docNote.textContent=DOCS[0].note;ta.value=SAMPLE;runTranslator();});
var docSel=document.getElementById("doc"), docNote=document.getElementById("doc-note");
docSel.innerHTML=DOCS.map(function(d,i){return '<option value="'+i+'">'+esc(d.title)+'</option>';}).join("");
docNote.textContent=DOCS[0].note;
docSel.addEventListener("change",function(){
  var d=DOCS[+docSel.value]; docNote.textContent=d.note;
  if(!d.file){ ta.value=SAMPLE; return runTranslator(); }
  fetch(d.file).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
   .then(function(t){ ta.value=t.trim(); runTranslator(); })
   .catch(function(e){ docNote.textContent="Could not load "+d.file+" ("+e.message+"). Run the ERATON app to load documents."; });
});
